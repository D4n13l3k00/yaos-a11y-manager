apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'dev.d4n13l3k00.yaosa11y'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.d4n13l3k00.yaosa11y'
        minSdk 23
        targetSdk 35
        versionCode 10201
        versionName '1.2.1'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'dev.mobile:dadb:2.0.0'
    implementation 'org.tukaani:xz:1.12'
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
}

def packagedWatchdogHook = file('src/main/assets/root/watchdog-hook.js')
def sourceWatchdogHook = rootProject.file('tools/watchdog-hook.js')

tasks.register('verifyRootPayload') {
    group = 'verification'
    description = 'Checks that the packaged watchdog hook matches its editable source.'
    inputs.files(packagedWatchdogHook, sourceWatchdogHook)
    doLast {
        if (!packagedWatchdogHook.exists() || !sourceWatchdogHook.exists()) {
            throw new GradleException('watchdog-hook.js source or packaged asset is missing')
        }
        if (!Arrays.equals(packagedWatchdogHook.bytes, sourceWatchdogHook.bytes)) {
            throw new GradleException(
                'app/src/main/assets/root/watchdog-hook.js differs from tools/watchdog-hook.js'
            )
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyRootPayload')
}
