name: Android

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK and run lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: YaOS-A11y-Manager-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Build signed release
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > D4n13l3k00-release.jks
          {
            printf 'storeFile=D4n13l3k00-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APK and run lint
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Name release APK
        shell: bash
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          test -n "$version"
          release_name="YaOS-A11y-Manager-v${version}"
          release_apk="${release_name}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$release_apk"
          sha256sum "$release_apk" > "$release_apk.sha256"
          printf 'RELEASE_NAME=%s\n' "$release_name" >> "$GITHUB_ENV"
          printf 'RELEASE_APK=%s\n' "$release_apk" >> "$GITHUB_ENV"
          printf 'RELEASE_SHA256=%s\n' "$release_apk.sha256" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_NAME }}
          path: |
            ${{ env.RELEASE_APK }}
            ${{ env.RELEASE_SHA256 }}
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_SHA256" \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RELEASE_APK" \
              "$RELEASE_SHA256" \
              --notes-file release-notes.md \
              --title "$GITHUB_REF_NAME"
          fi
